<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
  <meta name="author" content="Trevor Parker">
  <meta charset="UTF-8">
  <title>Bear, Ninja, Hunter</title>
</head>
<!-- Defines language, author, title, and encoding -->
<body>
  <p id="demo">filler/replace</p>
<!-- PlaceHolder for after game -->
  <script>
    let replay = "yes";
//allows for replaying

    let username;
//allows for username to be called out of for loop

    for (i=0; i < 1; i++){
//runs a one time check for username
      
      let username = prompt("Welcome to Bear Hunter Ninja! Please enter your name to get started");
      console.log(username);
      if (username === null) {
        alert("Please Press F5 to Play Again")
        break;
      }
      else{
        let amessage = "Hi " + username + " Let\'s Play!!";
        alert(amessage)
        }
    }
//check to see if player hits cancel here, otherwise continues with a prompt
    
    while (replay === "yes"){  //Moved so username would only be asked for once
    
      const options = ["bear", "ninja", "hunter"];
//array for computer to randomize to. Math Random * length will allow it to have a maximum of 2
      
      let userChoice = prompt("Who are you: Bear, Ninja, or Hunter");
        if (userChoice === null) {
        alert("Please Press F5 to Play Again")
        break;
      }
//Checks to see if user hits cancel on user choice
      userChoice = userChoice.toLowerCase();
//avoids a syntax error in attempting to lowercase null
      
      if (!options.includes(userChoice)) {
        alert("Invalid Entry Please \n press F5 to Play Again")
        break;
      }
//Checks if player entry is valid, if not ends game      

      let computerChoice = options[Math.floor(Math.random() * options.length)];
      console.log(computerChoice);
// Randomizes Computer choice
      
      let result;
// Allows result to be called outside the if block
      if (userChoice === computerChoice) {
        result = "Its a Tie!";
      }
//covers the 3 options for a tie
      else if (
        (userChoice === "bear" && computerChoice === "ninja")||
        (userChoice === "ninja" && computerChoice === "hunter")||
        (userChoice === "hunter" && computerChoice === "bear")
      ) 
      {
        result = "You Win!";
      }
//Covers the 3 winning scenarios
      else {
        result = "You lose!";
      }
//covers the 3 losing scenarios
    
      document.getElementById("demo").innerHTML = `
        <br>${username}, You Picked ${userChoice}!
        <br>The computer picked ${computerChoice}!
        <br><strong>${result}</strong>
      `;
//Rewites place holder with proviously selected choices

      alert(result);
      console.log(result);
//Writes out choices to the screen/webpage
      
      replay = prompt("Do you want to play again? Yes or no")
//Asks to play again
      if (replay === null) {
        alert("Please Press F5 to Play Again")
        break;
      }
//Checks if player hits cancel, if so prompts a Play Again message

      replay =replay.toLowerCase();
//Covers for the syntax error of lowercasing null
        
      switch(replay) {
        case "yes":
          break;
        case "no":
          alert("Thanks for playing! Goodbye!");
          replay = "no";
          break;
        default:
          alert("invalid input. Please Press F5 to Play Again");
          replay = "no";
          break;
        }
      }
//Reads input to determine wheter the player wants to play again. If no exits while loop, if yes restarts loop
      
  </script>
</body>
</html>
